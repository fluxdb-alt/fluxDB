[package]
name = "fluxdb-app"
version = "0.1.0"
edition = "2024"

[dependencies]
fluxdb-completion = { path = "../fluxdb-completion" }
fluxdb-connectors = { path = "../fluxdb-connectors" }
fluxdb-core = { path = "../fluxdb-core" }
fluxdb-editor-core = { path = "../fluxdb-editor-core" }
fluxdb-storage = { path = "../fluxdb-storage" }
sqlformat = "0.5.0"
sqlparser = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
uuid = { version = "1.23", features = ["v4"] }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
serde_json = "1"
# 插件配置声明协议：内置声明与 manifest 声明共用同一套反序列化与校验。
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
url = "2"
ring = "0.17.14"
sha2 = "0.10.9"
semver = "1.0.28"
zip = { version = "8", default-features = false, features = ["deflate"] }
# 附件 CSV 流式分段解析（引号转义/嵌入换行交给 crate，不手写状态机）。
csv = "1.4"
# 已授权附件与编辑器快照的正文搜索：memchr 的 memmem 使用 SIMD 加速子串扫描。
memchr = "2.8.3"
# 本地 MCP 客户端注册：跨平台主目录/配置目录解析（6.0.0 已在 Cargo.lock，gpui 栈间接引入）。
dirs = "6"
# 注册到 Codex 的 `~/.codex/config.toml`：保留用户既有格式与注释，只增量改 `[mcp_servers.*]`。
toml_edit = "0.22"

# 应用内 MCP 端点（Streamable HTTP）：服务端协议实现、异步运行时与 HTTP/1.1 监听。
# hyper/http-body-util/tower-service 均已在 Cargo.lock（gpui/ureq 间接引入），无新增版本线。
rmcp = { version = "1.8", default-features = false, features = ["server", "transport-streamable-http-server", "schemars"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "http1", "http2", "tokio"] }
http-body-util = "0.1"
bytes = "1"
tower-service = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# 附件安全打开：CreateFileW/GetFinalPathNameByHandleW 逐级拒绝 reparse point，
# 与 apps/fluxdb-desktop 已有 windows 0.57 同版本，不新增升级。
windows = { version = "0.57", features = [
    "Win32_Storage_FileSystem",
    # Win32_Security 门控 FileSystem 模块内的 CreateFileW（windows 0.57 源码确认）。
    "Win32_Security",
] }
