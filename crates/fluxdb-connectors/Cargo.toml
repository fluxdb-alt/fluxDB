[package]
name = "fluxdb-connectors"
version = "0.1.0"
edition = "2024"

[dependencies]
fluxdb-core = { path = "../fluxdb-core" }
sqlparser = { workspace = true }
sqlx = { version = "0.8.6", default-features = false, features = ["bigdecimal", "chrono", "mysql", "sqlite", "runtime-tokio-rustls"] }
ssh2 = "0.9"
dirs = "6"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "time", "macros", "sync"] }
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime", "with-uuid-1", "with-time-0_3", "with-chrono-0_4"] }
futures-util = "0.3"
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
# 解密 PKCS#8 加密私钥（客户端证书 mTLS）；口令只在内存中使用。
pkcs8 = { version = "0.11", features = ["encryption", "pem"] }
webpki-roots = "0.26"
base64 = "0.22"
chrono = "0.4"
tracing = "0.1"
tokio-util = { version = "0.7", features = ["compat"] }
# SQL Server 使用纯 Rust TDS；显式关闭默认 native-tls/winauth，避免 macOS
# Security Framework 与 SQL Server TLS 的兼容问题，也避免引入 SSPI/GSSAPI。
tiberius = { path = "../tiberius", default-features = false, features = ["tds73", "chrono", "rustls", "sql-browser-tokio"] }
dm-pure = { path = "../dm-pure" }
# Oracle 使用官方纯 Rust 驱动（TTC 协议直连，无 Instant Client / OCI 依赖），
# 因此不需要分发本地动态库；支持 12c 及以上服务端。
oracledb = "26.0.0-beta.5"
csv = "1.4"
serde_json = "1"
# 仅用于 MongoDB 游标的 `DeserializeOwned` 约束（驱动游标要求）。
serde = { version = "1", default-features = false }
roxmltree = "0.21"
# 导入文件按用户选择解码（UTF-8/GB18030 等）。
encoding_rs = "0.8"
mongodb = { version = "3.7", default-features = false, features = ["compat-3-0-0", "rustls-tls", "dns-resolver"] }
json5 = "1"
