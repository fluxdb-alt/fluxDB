[package]
name = "fluxdb-storage"
version = "0.1.0"
edition = "2024"

[features]
# 供外部集成测试复用隔离的测试凭据/配置注入点；默认不启用（生产不含 override 代码路径的生效分支）。
test-util = []

[dependencies]
fluxdb-core = { path = "../fluxdb-core" }
# 跨平台系统目录解析（Known Folder / XDG）。6.0.0 已在 Cargo.lock（gpui 栈间接引入），无新增版本。
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"

# 连接密码 AES-256-GCM（密文在 SQLite，默认密钥内置，可通过 config.toml 覆盖）。
aes-gcm = "0.10"
rand = "0.8"
