[package]
name = "fluxdb-storage"
version = "0.1.0"
edition = "2024"

[dependencies]
fluxdb-core = { path = "../fluxdb-core" }
# 跨平台系统目录解析（Known Folder / XDG）。6.0.0 已在 Cargo.lock（gpui 栈间接引入），无新增版本。
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
