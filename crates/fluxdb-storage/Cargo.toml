[package]
name = "fluxdb-storage"
version = "0.1.0"
edition = "2024"

[features]
# 供外部集成测试复用隔离的测试凭据/配置注入点；默认不启用（生产不含 override 代码路径的生效分支）。
test-util = []

[dependencies]
fluxdb-core = { path = "../fluxdb-core" }
# 跨平台系统目录解析（Known Folder / XDG）。6.0.0 已在 Cargo.lock（gpui 栈间接引入），无新增版本。
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"

# Linux 系统凭据后端：Secret Service（GNOME Keyring / KWallet 等实现）。经 keyring 4 默认
# feature（v1 = apple-native + windows-native + zbus-secret-service）；apple/windows 组件被
# target 门控，Linux 实际启用 zbus-secret-service-keyring-store（纯 Rust zbus，无 C 原生依赖，
# 利于 CI 与发布，方案 §4.2）。仅 Linux 目标声明；Windows/macOS 不引入。
[target.'cfg(target_os = "linux")'.dependencies]
keyring = "4"

# Windows 系统凭据后端：Credential Manager，直接经 windows crate（锁内既有版本）。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.57", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
] }
