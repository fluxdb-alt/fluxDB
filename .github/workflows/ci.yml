name: CI

# AI-00：三平台原生构建、测试与内部候选产物。
# 本工作流只生成内部候选产物，不创建 tag、不公开发布 Release。
# 各平台使用原生 runner；macOS 上的交叉 cargo check 不作为 Windows/Linux 验证通过依据。
on:
  # 适配分支自身 push + 面向 main 的 PR 触发；另提供 workflow_dispatch 手动复跑。
  # 不修改 main 版本 workflow（不动 release.yml），仅在当前适配分支配置。
  push:
    branches:
      - main
      - adapt/win-linux
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  socket-probe:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Diagnose socket cancellation on Windows
        shell: pwsh
        run: |
          rustc --edition 2024 scripts/ci/socket-shutdown.rs -o socket-shutdown.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./socket-shutdown.exe

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS (Apple Silicon)
          - os: macos-14
            target: aarch64-apple-darwin
            arch: aarch64
          # Windows x64 (MSVC)
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            arch: x64
          # Linux x64 基线 (Ubuntu 22.04)
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x64
    runs-on: ${{ matrix.os }}

    timeout-minutes: 90

    env:
      CARGO_TERM_COLOR: always
      TARGET: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # 按 docs/2026-09-14-windows-linux-support-plan.md §3.4 安装 GPUI/Linux 原生构建依赖。
          # 包含: C/C++ 编译器、pkg-config、OpenSSL、fontconfig、FreeType、
          #   xkbcommon、X11/XCB、Wayland 开发包，以及 wgpu 图形后端的库。
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang \
            libssl-dev \
            libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdbus-1-dev

      # Windows/Ubuntu/macOS 均使用 Cargo.lock + --locked，避免浮动依赖。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ github.workspace }}
          key: ${{ matrix.target }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Workspace check (locked)
        run: cargo check --workspace --locked --target ${{ matrix.target }}

      # release 构建/产物在测试之前执行，先验证 Windows fxc/HLSL 等完整 release 链路。
      - name: Build fluxdb-desktop (release, locked)
        run: cargo build --locked --release --target ${{ matrix.target }} -p fluxdb-desktop

      - name: Generate release artifact checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd "target/${{ matrix.target }}/release"
          # sha256sum 在 macOS 默认不存在，用 python3 做跨平台校验和。
          python3 - <<'PY'
          import hashlib, pathlib, os
          files = [p for p in pathlib.Path('.').iterdir()
                   if p.name.startswith('fluxdb-desktop') and not p.name.endswith('.sha256') and p.is_file()]
          with open('fluxdb-desktop.sha256', 'w') as out:
              for p in sorted(files):
                  h = hashlib.sha256(p.read_bytes()).hexdigest()
                  print(f"{h}  {p.name}", file=out)
          PY
          cat fluxdb-desktop.sha256

      - name: Upload internal candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxdb-desktop-${{ matrix.os }}-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/fluxdb-desktop*
            target/${{ matrix.target }}/release/fluxdb-desktop.sha256
          if-no-files-found: error
          retention-days: 14

      # 与数据库/SSH/凭据服务无关的单元测试；真实 PG 用例由 FLUXDB_PG_SMOKE 显式启用，
      # 在具备隔离服务的集成测试 job 中执行。
      - name: Test core crates
        run: cargo test --locked --target ${{ matrix.target }} -p fluxdb-core -p fluxdb-editor-core -p fluxdb-editor-language

      - name: Test storage/app/connectors
        run: cargo test --locked --target ${{ matrix.target }} -p fluxdb-storage -p fluxdb-app -p fluxdb-connectors

      - name: Test PTY child cleanup (Unix)
        if: runner.os != 'Windows'
        run: cargo test --locked --target ${{ matrix.target }} -p fluxdb-desktop terminal_reap_tests
