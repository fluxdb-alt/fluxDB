name: CI

# 三平台原生构建验证（手动预检）。
#
# 只提供 workflow_dispatch：不在合并时自动触发，日常质量由本地门禁保证
# （见 scripts/check.sh 与 AGENTS.md「测试与验收」）。三平台编译差异
# （Windows fxc/HLSL、Linux xkbcommon/OpenSSL 等）在 Mac 本地 cargo check 中看不到，
# 因此发布前的跨平台验证靠「打 tag 前手动跑一次本工作流，全绿后再打 tag」这条纪律。
#
# 本工作流只验证、不产出：不生成安装包、不上传产物。真正的发布产物由
# release.yml 在 push v* tag 时构建并上传到 GitHub Release（与本工作流无关）。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # 手动预检必须跑完：被后来一次运行取消掉等于没验证。
  cancel-in-progress: false

jobs:
  socket-probe:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Diagnose socket cancellation on Windows
        shell: pwsh
        run: |
          rustc --edition 2024 scripts/ci/socket-shutdown.rs -o socket-shutdown.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./socket-shutdown.exe

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS (Apple Silicon)
          - os: macos-15
            target: aarch64-apple-darwin
          # Windows x64 (MSVC)
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          # Linux x64 基线 (Ubuntu 22.04)
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}

    timeout-minutes: 90

    env:
      CARGO_TERM_COLOR: always
      TARGET: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # 按 docs/2026-09-14-windows-linux-support-plan.md §3.4 安装 GPUI/Linux 原生构建依赖。
          # 包含: C/C++ 编译器、pkg-config、OpenSSL、fontconfig、FreeType、
          #   xkbcommon、X11/XCB、Wayland 开发包，以及 wgpu 图形后端的库。
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang \
            libssl-dev \
            libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdbus-1-dev

      # Windows/Ubuntu/macOS 均使用 Cargo.lock + --locked，避免浮动依赖。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ github.workspace }}
          key: ${{ matrix.target }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Workspace check (locked)
        run: cargo check --workspace --locked --target ${{ matrix.target }}

      # release 构建是唯一能暴露 release 专属链路问题（Windows fxc/HLSL 等）的检查，
      # 即使不上传产物也必须跑。
      - name: Build fluxdb-desktop (release, locked)
        run: cargo build --locked --release --target ${{ matrix.target }} -p fluxdb-desktop

      # 本工作流只验证，不生成安装包、不上传产物：发布产物由 release.yml 在打 tag 时产出。
      # release 构建仍必须跑——它才是能暴露 Windows fxc/HLSL 等 release 专属链路的检查。
