name: Release Packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel  # Intel x64
            target: x86_64-apple-darwin
            arch: x64
          - os: macos-14        # Apple Silicon
            target: aarch64-apple-darwin
            arch: arm64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang \
            libssl-dev \
            libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build and package DMG
        shell: bash
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
          # 完成 app 签名后释放编译中间产物，为 hdiutil 预留镜像创建空间。
          CLEAN_CARGO_TARGET_BEFORE_DMG: "1"
        run: |
          set -euo pipefail
          export VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/package-macos.sh
          DMG="target/macos-package/FluxDB-$VERSION-macos-${{ matrix.arch }}.dmg"
          hdiutil verify "$DMG"
          shasum -a 256 "$DMG" > "$DMG.sha256"
          echo "artifact=$DMG" >> "$GITHUB_ENV"

      - name: Build Windows desktop binary
        if: runner.os == 'Windows'
        run: cargo build --locked --release --target ${{ matrix.target }} -p fluxdb-desktop

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$version" scripts/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify and checksum Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem target/windows-package/FluxDB-*-windows-x64-setup.exe)
          if ($setup.Count -ne 1) { throw "Expected exactly one Windows installer" }
          $hash = Get-FileHash $setup[0].FullName -Algorithm SHA256
          "$($hash.Hash.ToLower())  $($setup[0].Name)" | Set-Content "$($setup[0].FullName).sha256"
          "artifact=$($setup[0].FullName)" | Add-Content $env:GITHUB_ENV

      - name: Build Linux desktop binary
        if: runner.os == 'Linux'
        run: cargo build --locked --release --target ${{ matrix.target }} -p fluxdb-desktop

      - name: Build Linux .deb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          pkg="fluxdb_${version}_amd64"
          dir="target/linux-package/$pkg"
          rm -rf target/linux-package
          mkdir -p "$dir/DEBIAN" "$dir/usr/bin" "$dir/usr/share/fluxdb"
          install -m 0755 "target/${{ matrix.target }}/release/fluxdb-desktop" "$dir/usr/bin/fluxdb"
          cp -r apps/fluxdb-desktop/assets "$dir/usr/share/fluxdb/assets"
          cat > "$dir/DEBIAN/control" <<EOF
          Package: fluxdb
          Version: $version
          Section: database
          Priority: optional
          Architecture: amd64
          Maintainer: FluxDB <fluxdb@shining3d.com>
          Depends: libc6, libssl3, libxcb1, libxkbcommon0, libxkbcommon-x11-0, zlib1g
          Description: FluxDB cross-platform SQL client
          EOF
          dpkg-deb --build --root-owner-group "$dir" "target/linux-package/${pkg}.deb"

      - name: Verify and checksum Linux .deb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          deb="target/linux-package/fluxdb_${version}_amd64.deb"
          dpkg-deb -c "$deb" | tee target/linux-package/contents.txt
          grep -q "usr/bin/fluxdb" target/linux-package/contents.txt
          grep -q "usr/share/fluxdb/assets/" target/linux-package/contents.txt
          dpkg-deb -x "$deb" target/linux-package/extract
          test -x target/linux-package/extract/usr/bin/fluxdb
          test -f target/linux-package/extract/usr/share/fluxdb/assets/app-icon.png
          sha256sum "$deb" > "$deb.sha256"
          echo "artifact=$deb" >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.artifact }}
            ${{ env.artifact }}.sha256
          fail_on_unmatched_files: true
