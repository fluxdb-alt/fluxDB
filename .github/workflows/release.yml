name: Release Packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel  # Intel x64
            target: x86_64-apple-darwin
            arch: x64
          - os: macos-15        # Apple Silicon
            target: aarch64-apple-darwin
            arch: arm64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      FLUXDB_UPDATE_PUBLIC_KEY: ${{ vars.FLUXDB_UPDATE_PUBLIC_KEY }}

    steps:
      - uses: actions/checkout@v5

      - name: Verify release tag matches desktop version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          crate_version="$(awk -F '"' '/^version = / { print $2; exit }' apps/fluxdb-desktop/Cargo.toml)"
          test "$version" = "$crate_version" || {
            echo "Tag version $version does not match apps/fluxdb-desktop/Cargo.toml version $crate_version" >&2
            exit 1
          }

      - name: Install Linux system build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang \
            libssl-dev \
            libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build and package DMG
        shell: bash
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
          # 完成 app 签名后释放编译中间产物，为 hdiutil 预留镜像创建空间。
          CLEAN_CARGO_TARGET_BEFORE_DMG: "1"
        run: |
          set -euo pipefail
          export VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/package-macos.sh
          DMG="target/macos-package/FluxDB-$VERSION-macos-${{ matrix.arch }}.dmg"
          UPDATER_ARCHIVE="target/macos-package/FluxDB-$VERSION-macos-${{ matrix.arch }}.app.tar.gz"
          hdiutil verify "$DMG"
          shasum -a 256 "$DMG" > "$DMG.sha256"
          shasum -a 256 "$UPDATER_ARCHIVE" > "$UPDATER_ARCHIVE.sha256"
          echo "artifact=$DMG" >> "$GITHUB_ENV"
          echo "updater_artifact=$UPDATER_ARCHIVE" >> "$GITHUB_ENV"

      - name: Build Windows desktop binary
        if: runner.os == 'Windows'
        run: cargo build --locked --release --target ${{ matrix.target }} -p fluxdb-desktop

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$version" scripts/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify and checksum Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem target/windows-package/FluxDB-*-windows-x64-setup.exe)
          if ($setup.Count -ne 1) { throw "Expected exactly one Windows installer" }
          $hash = Get-FileHash $setup[0].FullName -Algorithm SHA256
          "$($hash.Hash.ToLower())  $($setup[0].Name)" | Set-Content "$($setup[0].FullName).sha256"
          "artifact=$($setup[0].FullName)" | Add-Content $env:GITHUB_ENV

      - name: Build Linux desktop binary
        if: runner.os == 'Linux'
        run: cargo build --locked --release --target ${{ matrix.target }} -p fluxdb-desktop

      - name: Build Linux .deb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          pkg="fluxdb_${version}_amd64"
          dir="target/linux-package/$pkg"
          rm -rf target/linux-package
          mkdir -p "$dir/DEBIAN" "$dir/usr/bin" "$dir/usr/share/fluxdb" \
            "$dir/usr/share/applications" "$dir/usr/share/icons/hicolor/512x512/apps"
          install -m 0755 "target/${{ matrix.target }}/release/fluxdb-desktop" "$dir/usr/bin/fluxdb"
          cp -r apps/fluxdb-desktop/assets "$dir/usr/share/fluxdb/assets"
          install -m 0644 packaging/linux/com.shining3d.fluxdb.desktop \
            "$dir/usr/share/applications/com.shining3d.fluxdb.desktop"
          install -m 0644 apps/fluxdb-desktop/assets/app-icon.png \
            "$dir/usr/share/icons/hicolor/512x512/apps/fluxdb.png"
          cat > "$dir/DEBIAN/control" <<EOF
          Package: fluxdb
          Version: $version
          Section: database
          Priority: optional
          Architecture: amd64
          Maintainer: FluxDB <fluxdb@shining3d.com>
          Depends: libc6, libssl3, libxcb1, libxkbcommon0, libxkbcommon-x11-0, zlib1g
          Description: FluxDB cross-platform SQL client
          EOF
          dpkg-deb --build --root-owner-group "$dir" "target/linux-package/${pkg}.deb"

      - name: Verify and checksum Linux .deb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          deb="target/linux-package/fluxdb_${version}_amd64.deb"
          dpkg-deb -c "$deb" | tee target/linux-package/contents.txt
          grep -q "usr/bin/fluxdb" target/linux-package/contents.txt
          grep -q "usr/share/fluxdb/assets/" target/linux-package/contents.txt
          grep -q "usr/share/applications/com.shining3d.fluxdb.desktop" target/linux-package/contents.txt
          grep -q "usr/share/icons/hicolor/512x512/apps/fluxdb.png" target/linux-package/contents.txt
          dpkg-deb -x "$deb" target/linux-package/extract
          test -x target/linux-package/extract/usr/bin/fluxdb
          test -f target/linux-package/extract/usr/share/fluxdb/assets/app-icon.png
          test -f target/linux-package/extract/usr/share/applications/com.shining3d.fluxdb.desktop
          test -f target/linux-package/extract/usr/share/icons/hicolor/512x512/apps/fluxdb.png
          sha256sum "$deb" > "$deb.sha256"
          echo "artifact=$deb" >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.artifact }}
            ${{ env.artifact }}.sha256
          fail_on_unmatched_files: true

      - name: Upload macOS updater archive
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" \
            "${{ env.updater_artifact }}" \
            "${{ env.updater_artifact }}.sha256" \
            --clobber

  publish-manifest:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      FLUXDB_UPDATE_SIGNING_KEY: ${{ secrets.FLUXDB_UPDATE_SIGNING_KEY }}
      FLUXDB_UPDATE_PUBLIC_KEY: ${{ vars.FLUXDB_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Publish bilingual release body when notes are provided
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if python3 scripts/build-release-body.py \
            --tag "$GITHUB_REF_NAME" \
            --notes-dir release-notes \
            --output target/release-body.md; then
            gh release edit "$GITHUB_REF_NAME" --notes-file target/release-body.md
          else
            echo "::warning::No complete bilingual release notes for $GITHUB_REF_NAME; keeping the existing release body."
          fi

      - name: Generate and sign updater manifest
        shell: bash
        run: |
          set -euo pipefail
          has_private_key="${FLUXDB_UPDATE_SIGNING_KEY:+1}"
          has_public_key="${FLUXDB_UPDATE_PUBLIC_KEY:+1}"
          if [[ -z "$has_private_key" && -z "$has_public_key" ]]; then
            echo "::warning::Update signing is not configured; release published without latest.json."
            exit 0
          fi
          if [[ -z "$has_private_key" || -z "$has_public_key" ]]; then
            echo "FLUXDB_UPDATE_SIGNING_KEY and FLUXDB_UPDATE_PUBLIC_KEY must be configured together." >&2
            exit 1
          fi
          mkdir -p target/updater
          python3 scripts/generate-update-manifest.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --notes-dir release-notes \
            --output target/updater/latest.json
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$FLUXDB_UPDATE_SIGNING_KEY" > "$key_file"
          openssl pkeyutl -sign -rawin -inkey "$key_file" \
            -in target/updater/latest.json \
            -out target/updater/latest.json.sig.bin
          base64 --wrap=0 target/updater/latest.json.sig.bin \
            > target/updater/latest.json.sig
          gh release upload "$GITHUB_REF_NAME" \
            target/updater/latest.json \
            target/updater/latest.json.sig \
            --clobber
