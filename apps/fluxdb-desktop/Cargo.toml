[package]
name = "fluxdb-desktop"
version = "0.1.14"
edition = "2024"
license = "GPL-3.0"
build = "build.rs"

[build-dependencies]
embed-resource = "3.0"

[dependencies]
anyhow = "1"
chrono = "0.4"
encoding_rs = "0.8"
futures = "0.3"
fluxdb-app = { path = "../../crates/fluxdb-app" }
fluxdb-completion = { path = "../../crates/fluxdb-completion" }
fluxdb-core = { path = "../../crates/fluxdb-core" }
fluxdb-editor-core = { path = "../../crates/fluxdb-editor-core" }
fluxdb-i18n = { path = "../../crates/fluxdb-i18n" }

fluxdb-mcp = { path = "../fluxdb-mcp" }
fluxdb-storage = { path = "../../crates/fluxdb-storage" }
gpui = { package = "gpui-pre", version = "=0.3.8" }
# gpui-component / gpui-base 0.7.1 的过程宏（`actions!`、`#[derive(Action)]` 等）用
# proc_macro_crate 解析调用方 crate：优先 `gpui-kit`，其次回退 `gpui-pre`。宏在
# 普通构建里同样要展开出可解析的 `::gpui_kit::…`，而 gpui-kit 在 0.7.x 中是应用应当
# 直接依赖的 facade（`gpui_kit::*` 即 GPUI），它重导出的正是同一份 gpui-pre 0.3.8 /
# gpui-component 0.7.1，类型完全一致。因此 gpui-kit 声明在普通依赖中。
gpui-kit = "=0.7.1"
# gpui-base 0.6.0 曾在其非 wasm 依赖中固定开启 gpui-platform 的 runtime_shaders；
# 0.7.1 改为由使用方显式选择。不开启时 gpui-pre-apple 的 build.rs 会调用
# `xcrun metal` 编译 shaders.metal，构建机因此被强制要求安装完整 Xcode
# （仅 Command Line Tools 缺少 metal），与升级前的可构建环境不一致。
# 这里显式开启以保持既有行为：着色器在运行时编译，构建只需 Rust 工具链。
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.8", features = [
    "runtime_shaders",
] }
gpui-component = { version = "=0.7.1", features = ["tree-sitter"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# 条件构建反向解析要接受 Compass 查询栏那种宽松写法（无引号键、单引号、注释、
# 尾逗号）。版本与连接器的 `mongo_parse_json` 一致，规则也在那里对齐。
json5 = "1"
lsp-types = "0.97"
portable-pty = "0.9"
regex = "1.13"
rust-i18n = "=4.2.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
smol = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "=0.26.13"
tree-sitter-json = "=0.24.8"
tree-sitter-sequel = "=0.3.11"
streaming-iterator = "0.1"
gpui-fps = "=0.7.1"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8", features = ["test-support"] }
tempfile = "3"

# Linux 首版不启用系统托盘（见 docs/2026-09-14-windows-linux-support-plan.md §3.2/§4.3）。
# tray-icon 在 Linux 目标上会无条件链接 GTK（libappindicator → gtk），即使 default-features=false 且不调用托盘函数也一样，
# 因此把它限定为“非 Linux”目标条件依赖，避免 Linux 发布包被迫携带 GTK 运行库。
# Windows / macOS 保留托盘能力。
[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.23.1", default-features = false }

# 单实例守卫（方案 §12.1 方案 A）：Unix 用 flock（nix），Windows 用命名互斥量。
# 两库均已在 Cargo.lock（nix 0.28 经 portable-pty、windows 0.57 经 gpui 栈），无版本升级。
[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", default-features = false, features = ["fs", "signal"] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.57", features = [
    "Win32_Foundation",
    # Win32_System_Threading 提供 Win32::System::Threading 模块路径；
    # Win32_Security 门控该模块内的 CreateMutexW 函数（windows 0.57 实读源码确认）。
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Dock 图标与原生文件面板改用 objc2 系列：cocoa 0.26 的全部类型/方法已标记 deprecated，
# 且 gpui-pre-apple 0.3.8 自身也已迁移到 objc2 0.6 / objc2-foundation 0.3.2，
# 这里对齐到同一套类型，避免跨 crate 的 Objective-C 对象互操作。
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = [
    "NSApplication",
    "NSImage",
    "NSOpenPanel",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSData",
    "NSString",
    "NSURL",
] }

[package.metadata.bundle]
name = "FluxDB"
identifier = "com.shining3d.fluxdb"
icon = ["assets/app-icon.icns"]
resources = ["assets"]
category = "Developer Tool"
short_description = "Desktop database client"
